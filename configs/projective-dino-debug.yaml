defaults:
 - training: base   # training configurations
 - machine: default_machine   # machine configurations -- path to datasets and models
 - model: concat_dino_mae_full   # model configurations
 - dataset: re10k_wai   # dataset configurations
 - profiling: disable   # profiling configurations
 - _self_  # overrides defined in this file

training:
