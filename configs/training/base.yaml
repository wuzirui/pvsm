# @package _global_

training:
  amp_dtype: bf16
  api_key_path: ./configs/api_keys.yaml
  batch_size_per_gpu: 8
  beta1: 0.9
  beta2: 0.95
  allowed_gradnorm_factor: 10
  center_crop: true
  scene_scale_factor: 1.35
  checkpoint_every: 2000
  grad_accum_steps: 1
  grad_checkpoint_every: 1
  grad_clip_norm: 1.0

  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.5
  confidence_l2_loss_weight: 0.0
  confidence_alpha: 0.0

  lr: 0.0004
  train_steps: 100000

  dynamic_input_view_num: false
  num_input_views: 2
  num_target_views: 6
  # min_input_views: 2
  # max_input_views: 2
  num_threads: 8
  num_views: 8
  num_workers: 64
  prefetch_factor: 2
  print_every: 20

  square_crop: true
  target_has_input: true
  use_amp: true
  use_rel_pose: false
  use_tf32: true
  view_selector:
    max_frame_dist: 80
    min_frame_dist: 10
  vis_every: 100
  wandb_log_every: 50
  val_every: 2000
  val_steps: 20
  
  wandb_project: LVSM
  warmup: 3000
  weight_decay: 0.05
  checkpoint_dir: ./experiments/checkpoints/${training.wandb_exp_name}

  ablation_group: none

  compute_gns: false
  gns_every: 200

  num_gpus: 4

# inference / evaluation
inference:
  if_inference: False
  compute_metrics: True
  inference_out_dir: ./experiments/inference/${training.wandb_exp_name}
  render_video: False
  render_video_config:
    traj_type: interpolate
    num_frames: 60
    loop_video: True 
    order_poses: False